name: CRM

on:
  push:
    paths:
      - "crm/**"
      - ".github/workflows/crm.yml"
  pull_request:
    paths:
      - "crm/**"
      - ".github/workflows/crm.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
